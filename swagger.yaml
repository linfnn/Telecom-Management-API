  /api_backup_database:
    get:
      tags: [Backup/Restore]
      operationId: api_backup_database
      summary: Tải file backup JSON
      description: |
        Chỉ admin được phép. Snapshot bao gồm các bảng `nhanvien`, `thietbi`,
        `lienket`, `hieusuat`, `lohong`, `nhatkyloi`. Giá trị `format` và
        `version` lấy từ cấu hình môi trường `BACKUP_FORMAT` và `BACKUP_VERSION`.
        File trả về tên `qlmvt_backup.json`.
      responses:
        "200":
          description: Nội dung JSON backup, được gửi kèm header Content-Disposition.
          headers:
            Content-Disposition:
              schema:
                type: string
              description: Tên file tải xuống.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api_restore_database:
    post:
      tags: [Backup/Restore]
      operationId: api_restore_database
      summary: Khôi phục database từ JSON backup
      description: |
        Chỉ admin được phép. Bản ghi đã tồn tại được cập nhật, chưa tồn tại
        được tạo mới; dữ liệu hiện có không bị xóa. Các bảng được restore theo
        thứ tự quan hệ khóa ngoại và toàn bộ thao tác nằm trong một transaction.
        Gửi JSON raw trong request body, không phải file multipart.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackupEnvelope"
      responses:
        "200":
          description: Restore thành công; data là số bản ghi đã xử lý theo bảng.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreResponse"
        "400":
          description: JSON backup sai định dạng, phiên bản, model, field hoặc giá trị.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api_export_table/{model_name}:
    parameters:
      - $ref: "#/components/parameters/ModelName"
    get:
      tags: [Import/Export]
      operationId: api_export_table
      summary: Export một bảng thành file JSON
      description: |
        Chỉ admin được phép. Các model được hỗ trợ: `nhanvien`, `thietbi`,
        `lienket`, `hieusuat`, `lohong`, `nhatkyloi`. File có tên
        `{model_name}_export.json`; `format` và `version` lấy từ cấu hình
        `IMPORT_EXPORT_FORMAT` và `IMPORT_EXPORT_VERSION`.
      responses:
        "200":
          description: Nội dung JSON export.
          headers:
            Content-Disposition:
              schema:
                type: string
              description: Tên file tải xuống.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportEnvelope"
        "400":
          description: Model không được hỗ trợ.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"
  /api_import_table/{model_name}:
    parameters:
      - $ref: "#/components/parameters/ModelName"
    post:
      tags: [Import/Export]
      operationId: api_import_table
      summary: Import dữ liệu từ file JSON
      description: |
        Chỉ admin được phép. Gửi file `.json` bằng `multipart/form-data`, tên
        field là `file`; file
        phải mã hóa UTF-8.
        Bản ghi có khóa chính trùng sẽ được cập nhật; bản ghi mới sẽ được tạo;
        bản ghi không có trong file không bị xóa. Import chạy trong transaction.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ImportFileRequest"
      responses:
        "200":
          description: Import thành công.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResponse"
        "400":
          description: Thiếu file, sai extension/encoding/JSON/model/format/version hoặc dữ liệu không hợp lệ.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token nhận được từ `/api_login/`.
  parameters:
    MaNhanVien:
      name: ma_nv
      in: path
      required: true
      description: Mã nhân viên.
      schema:
        type: integer
    MaThietBi:
      name: ma_tb
      in: path
      required: true
      description: Mã thiết bị.
      schema:
        type: integer
    ModelName:
      name: model_name
      in: path
      required: true
      description: Tên model được hỗ trợ.
      schema:
        type: string
        enum: [nhanvien, thietbi, lienket, hieusuat, lohong, nhatkyloi]
  responses:
    Unauthorized:
      description: Thiếu access token hoặc token không hợp lệ/hết hạn.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Người dùng đã xác thực nhưng không đủ quyền.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Không tìm thấy bản ghi.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServerError:
      description: Lỗi hệ thống hoặc kết nối database.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Deleted:
      description: Xóa thành công.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MessageResponse"
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          description: Nội dung lỗi; một số endpoint trả lỗi serializer theo cấu trúc object.
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
            - type: array
              items:
                type: object
                additionalProperties: true
      required: [error]
      additionalProperties: true
    ValidationErrorResponse:
      type: object
      description: Lỗi validate từ serializer hoặc lỗi được bọc trong key `error`.
      properties:
        error:
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
            - type: array
              items:
                type: object
                additionalProperties: true
      additionalProperties: true
    ErrorOrValidationResponse:
      description: Lỗi nghiệp vụ dạng chuỗi hoặc lỗi validate theo trường.
      oneOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          additionalProperties: true
    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    LoginResponse:
      type: object
      required: [message, access_token, access_expired_at, refresh_token, refresh_expired_at, user]
      properties:
        message:
          type: string
          example: Đăng nhập thành công
        access_token:
          type: string
          description: JWT access token dùng trong Authorization Bearer.
        access_expired_at:
          type: string
          format: date-time
          description: Thời điểm hết hạn access token.
        refresh_token:
          type: string
          description: Refresh token dùng để làm mới access token hoặc đăng xuất.
        refresh_expired_at:
          type: string
          format: date-time
          description: Thời điểm hết hạn refresh token.
        user:
          $ref: "#/components/schemas/Account"
    LogoutRequest:
      type: object
      required: [refresh]
      properties:
        refresh:
          type: string
          description: Refresh token cần blacklist.
    TokenRefreshRequest:
      type: object
      required: [refresh]
      properties:
        refresh:
          type: string
    TokenRefreshResponse:
      type: object
      required: [access]
      properties:
        access:
          type: string
          description: Access token mới.
        refresh:
          type: string
          description: Refresh token mới, được trả về khi bật rotation.
    CreateAccountRequest:
      type: object
      required: [ma_nv, password]
      properties:
        ma_nv:
          type: integer
        password:
          type: string
          format: password
          minLength: 6
        is_admin:
          type: boolean
          default: false
    ChangePasswordRequest:
      type: object
      required: [old_password, new_password]
      properties:
        old_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          minLength: 6
    Account:
      type: object
      required: [ma_nv, ho_ten, email, role]
      properties:
        ma_nv:
          type: integer
          description: Mã nhân viên liên kết.
        ho_ten:
          type: string
          nullable: true
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, user]
    CreateAccountResponse:
      type: object
      required: [message, account]
      properties:
        message:
          type: string
        account:
          $ref: "#/components/schemas/Account"
    NhanVien:
      type: object
      properties:
        ma_nv:
          type: integer
          readOnly: true
        ho_ten:
          type: string
          maxLength: 100
          nullable: true
        email:
          type: string
          maxLength: 100
          nullable: true
          description: Email nhân viên; phải duy nhất nếu được cung cấp.
        so_dien_thoai:
          type: string
          maxLength: 15
          nullable: true
        vai_tro:
          type: string
          maxLength: 50
          nullable: true
        chuyen_mon:
          type: string
          maxLength: 100
          nullable: true
    NhanVienInput:
      allOf:
        - $ref: "#/components/schemas/NhanVien"
      description: Không gửi `ma_nv` khi tạo mới; mã được database tự sinh.
    NhanVienInputOrList:
      oneOf:
        - $ref: "#/components/schemas/NhanVienInput"
        - type: array
          items:
            $ref: "#/components/schemas/NhanVienInput"
    NhanVienOrList:
      oneOf:
        - $ref: "#/components/schemas/NhanVien"
        - type: array
          items:
            $ref: "#/components/schemas/NhanVien"
    ThietBi:
      type: object
      required: [tinh_trang]
      properties:
        ma_tb:
          type: integer
          readOnly: true
        ten_tb:
          type: string
          maxLength: 100
          nullable: true
        loai_tb:
          type: string
          maxLength: 50
          nullable: true
        dia_chi_ip:
          type: string
          maxLength: 15
          nullable: true
          description: Địa chỉ IP duy nhất nếu được cung cấp.
        vi_tri:
          type: string
          maxLength: 200
          nullable: true
        trang_thai:
          type: string
          maxLength: 20
          nullable: true
        tinh_trang:
          type: string
          maxLength: 20
    ThietBiInput:
      allOf:
        - $ref: "#/components/schemas/ThietBi"
      description: Không gửi `ma_tb` khi tạo mới; khi cập nhật phải gửi `tinh_trang`.
    ThietBiInputOrList:
      oneOf:
        - $ref: "#/components/schemas/ThietBiInput"
        - type: array
          items:
            $ref: "#/components/schemas/ThietBiInput"
    ThietBiOrList:
      oneOf:
        - $ref: "#/components/schemas/ThietBi"
        - type: array
          items:
            $ref: "#/components/schemas/ThietBi"
    ChiSoHieuSuat:
      type: object
      properties:
        ma_cs:
          type: integer
          readOnly: true
        ma_tb:
          type: integer
          nullable: true
          description: Khóa ngoại tới thiết bị.
        thoi_gian_ghi_nhan:
          type: string
          format: date-time
          nullable: true
        do_tre:
          type: number
          format: float
          nullable: true
        mat_goi:
          type: number
          format: float
          nullable: true
        bang_thong_su_dung:
          type: number
          format: float
          nullable: true
    LoHong:
      type: object
      properties:
        ma_lh:
          type: integer
          readOnly: true
        ma_tb:
          type: integer
          nullable: true
          description: Khóa ngoại tới thiết bị.
        ten_lo_hong:
          type: string
          maxLength: 200
          nullable: true
        muc_do:
          type: string
          maxLength: 20
          nullable: true
        trang_thai_khac_phuc:
          type: string
          maxLength: 20
          nullable: true
          enum: [Chưa vá, Đang xử lý, Đã vá]
        thoi_gian_xay_ra_su_co:
          type: string
          format: date-time
          nullable: true
        thoi_gian_xu_ly_su_co:
          type: string
          format: date-time
          nullable: true
          description: Được ghi tự động khi chuyển sang Đã vá.
        manv_xuly:
          type: integer
          nullable: true
          description: Mã nhân viên được phân công.
    LoHongInput:
      allOf:
        - $ref: "#/components/schemas/LoHong"
      description: "`ma_lh` bị bỏ qua khi tạo; thời gian và trạng thái có giá trị mặc định."
    LoHongInputOrList:
      oneOf:
        - $ref: "#/components/schemas/LoHongInput"
        - type: array
          items:
            $ref: "#/components/schemas/LoHongInput"
    LoHongOrList:
      oneOf:
        - $ref: "#/components/schemas/LoHong"
        - type: array
          items:
            $ref: "#/components/schemas/LoHong"
    LoHongUpdateRequest:
      type: object
      minProperties: 1
      properties:
        ma_tb:
          type: integer
          nullable: true
          description: Chỉ admin; mã thiết bị liên quan.
        ten_lo_hong:
          type: string
          maxLength: 200
          nullable: true
          description: Chỉ admin.
        muc_do:
          type: string
          maxLength: 20
          nullable: true
          description: Chỉ admin.
        trang_thai_khac_phuc:
          type: string
          enum: [Chưa vá, Đang xử lý, Đã vá]
        thoi_gian_xay_ra_su_co:
          type: string
          format: date-time
          nullable: true
          description: Chỉ admin.
        manv_xuly:
          type: integer
          nullable: true
          description: Chỉ admin và tuân theo giới hạn đổi người xử lý theo trạng thái.
    LienKet:
      type: object
      properties:
        ma_lk:
          type: integer
          readOnly: true
        matb_goc:
          type: integer
          nullable: true
          description: Mã thiết bị nguồn.
        matb_dich:
          type: integer
          nullable: true
          description: Mã thiết bị đích.
        bang_thong_toi_da:
          type: number
          format: float
          nullable: true
        manv_tao:
          type: integer
          nullable: true
          description: Mã nhân viên tạo liên kết; mặc định là nhân viên của admin đang đăng nhập.
    LienKetInput:
      allOf:
        - $ref: "#/components/schemas/LienKet"
      description: Không cần gửi `ma_lk` khi tạo mới.
    LienKetInputOrList:
      oneOf:
        - $ref: "#/components/schemas/LienKetInput"
        - type: array
          items:
            $ref: "#/components/schemas/LienKetInput"
    LienKetOrList:
      oneOf:
        - $ref: "#/components/schemas/LienKet"
        - type: array
          items:
            $ref: "#/components/schemas/LienKet"
    NhatKyLoi:
      type: object
      required: [da_xu_ly]
      properties:
        ma_loi:
          type: integer
          readOnly: true
        ma_tb:
          type: integer
          nullable: true
          description: Khóa ngoại tới thiết bị.
        thoi_gian_loi:
          type: string
          format: date-time
          nullable: true
        mo_ta_loi:
          type: string
          nullable: true
        muc_do_nghiem_trong:
          type: integer
          nullable: true
        manv_xuly:
          type: integer
          nullable: true
          description: Mã nhân viên được phân công xử lý.
        da_xu_ly:
          type: boolean
        thoi_gian_hoan_thanh:
          type: string
          format: date-time
          nullable: true
          description: Được ghi tự động khi sự cố chuyển sang đã xử lý.
    NhatKyLoiInput:
      allOf:
        - $ref: "#/components/schemas/NhatKyLoi"
      description: Không cần gửi `ma_loi`; `da_xu_ly` là bắt buộc.
    NhatKyLoiInputOrList:
      oneOf:
        - $ref: "#/components/schemas/NhatKyLoiInput"
        - type: array
          items:
            $ref: "#/components/schemas/NhatKyLoiInput"
    NhatKyLoiOrList:
      oneOf:
        - $ref: "#/components/schemas/NhatKyLoi"
        - type: array
          items:
            $ref: "#/components/schemas/NhatKyLoi"
    NhatKyLoiUpdateRequest:
      type: object
      minProperties: 1
      properties:
        ma_tb:
          type: integer
          nullable: true
          description: Chỉ admin.
        mo_ta_loi:
          type: string
          nullable: true
          description: Chỉ admin.
        muc_do_nghiem_trong:
          type: integer
          nullable: true
          description: Chỉ admin.
        manv_xuly:
          type: integer
          nullable: true
          description: Chỉ admin; dùng endpoint phân công chuyên biệt để phân công nhân viên.
        da_xu_ly:
          type: boolean
          description: Nhân viên chỉ được chuyển false thành true.
    AssignEmployeeRequest:
      type: object
      required: [manv_xuly]
      properties:
        manv_xuly:
          type: integer
          description: Mã nhân viên tồn tại.
        da_xu_ly:
          type: boolean
          default: false
    BaoCaoTongQuan:
      type: object
      required: [nhan_vien, thiet_bi, lien_ket, nhat_ky_loi, lo_hong, chi_so_hieu_suat]
      properties:
        nhan_vien:
          type: integer
        thiet_bi:
          type: integer
        lien_ket:
          type: integer
        nhat_ky_loi:
          $ref: "#/components/schemas/ThongKeXuLy"
        lo_hong:
          $ref: "#/components/schemas/TinhTrangLoHong"
        chi_so_hieu_suat:
          type: integer
    ThongKeXuLy:
      type: object
      required: [tong, da_xu_ly, chua_xu_ly]
      properties:
        tong:
          type: integer
        da_xu_ly:
          type: integer
        chua_xu_ly:
          type: integer
    TinhTrangLoHong:
      type: object
      required: [tong, da_va, chua_va, dang_xu_ly]
      properties:
        tong:
          type: integer
        da_va:
          type: integer
        chua_va:
          type: integer
        dang_xu_ly:
          type: integer
    TongLoiNhanVien:
      type: object
      required: [ma_nv, ho_ten, su_co]
      properties:
        ma_nv:
          type: integer
        ho_ten:
          type: string
          nullable: true
        su_co:
          type: object
          required: [tong, da_xu_ly, dang_xu_ly]
          properties:
            tong:
              type: integer
            da_xu_ly:
              type: integer
            dang_xu_ly:
              type: integer
    LoHongTheoThietBi:
      type: object
      required: [ten_tb, tong_lo_hong, muc_do]
      properties:
        ten_tb:
          type: string
          nullable: true
        tong_lo_hong:
          type: integer
        muc_do:
          type: object
          required: [critical, high, medium, low]
          properties:
            critical:
              type: integer
            high:
              type: integer
            medium:
              type: integer
            low:
              type: integer
    BackupEnvelope:
      type: object
      required: [format, version, models]
      properties:
        format:
          type: string
          description: Giá trị phải khớp BACKUP_FORMAT trong cấu hình máy chủ.
        version:
          type: integer
          description: Giá trị phải khớp BACKUP_VERSION trong cấu hình máy chủ.
        models:
          type: object
          description: |
            Danh sách theo từng model. Nếu thiếu key model, restore coi model đó
            là danh sách rỗng. Các bản ghi cần có khóa chính tương ứng.
          properties:
            nhanvien:
              type: array
              items:
                $ref: "#/components/schemas/NhanVien"
            thietbi:
              type: array
              items:
                $ref: "#/components/schemas/ThietBi"
            lienket:
              type: array
              items:
                $ref: "#/components/schemas/LienKet"
            hieusuat:
              type: array
              items:
                $ref: "#/components/schemas/ChiSoHieuSuat"
            lohong:
              type: array
              items:
                $ref: "#/components/schemas/LoHong"
            nhatkyloi:
              type: array
              items:
                $ref: "#/components/schemas/NhatKyLoi"
          additionalProperties: false
    RestoreResponse:
      type: object
      required: [message, data]
      properties:
        message:
          type: string
        data:
          type: object
          additionalProperties:
            type: integer
          description: Số bản ghi được tạo/cập nhật theo từng model.
    ExportEnvelope:
      type: object
      required: [format, version, model, records]
      properties:
        format:
          type: string
          description: Giá trị cấu hình IMPORT_EXPORT_FORMAT.
        version:
          type: integer
          description: Giá trị cấu hình IMPORT_EXPORT_VERSION.
        model:
          type: string
          enum: [nhanvien, thietbi, lienket, hieusuat, lohong, nhatkyloi]
        records:
          type: array
          items:
            type: object
            description: Bản ghi gồm các field concrete của model.
            additionalProperties: true
    ImportFileRequest:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: File JSON UTF-8, phần mở rộng `.json`.
    ImportResponse:
      type: object
      required: [message, data]
      properties:
        message:
          type: string
        data:
          type: object
          required: [model, total, created, updated]
          properties:
            model:
              type: string
              enum: [nhanvien, thietbi, lienket, hieusuat, lohong, nhatkyloi]
            total:
              type: integer
            created:
              type: integer
            updated:
              type: integer
