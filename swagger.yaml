openapi: 3.0.3
info:
  title: QLMVT Web API
  version: 1.0.0
  description: |
    Tài liệu OpenAPI cho các endpoint được khai báo trong `qlmvt/urls.py`.
    Ứng dụng được mount tại `/qlmvt/`; các đường dẫn bên dưới được ghép với
    server URL này.

    Hầu hết endpoint yêu cầu JWT access token trong header
    `Authorization: Bearer <access_token>`. Endpoint đăng nhập, đăng xuất và
    làm mới token không yêu cầu quyền đăng nhập theo cấu hình hiện tại.

    Quyền `admin` tương ứng với tài khoản Django có `is_staff=true`.
    `user` là tài khoản đã đăng nhập nhưng không phải admin. Một số endpoint
    giới hạn dữ liệu hoặc quyền sửa theo nhân viên được liên kết với tài khoản.

    Import và export dùng hai đường dẫn riêng: GET
    `/api_export_table/{model_name}` tải file export; POST
    `/api_import_table/{model_name}` nhận file import.
  contact:
    name: QLMVT API
servers:
  - url: /qlmvt
    description: Django URL prefix
tags:
  - name: Xác thực
    description: Đăng nhập, JWT, thông tin tài khoản và đổi mật khẩu.
  - name: Nhân viên
    description: Tra cứu và quản lý nhân viên.
  - name: Thiết bị
    description: Tra cứu và quản lý thiết bị mạng.
  - name: Hiệu suất
    description: Tra cứu chỉ số hiệu suất thiết bị.
  - name: Lỗ hổng
    description: Quản lý và cập nhật trạng thái lỗ hổng.
  - name: Liên kết
    description: Quản lý liên kết giữa các thiết bị.
  - name: Nhật ký lỗi
    description: Quản lý sự cố và phân công nhân viên xử lý.
  - name: Báo cáo
    description: Thống kê hệ thống, lỗi, KPI và lỗ hổng.
  - name: Backup/Restore
    description: Tải snapshot JSON hoặc khôi phục dữ liệu từ snapshot.
  - name: Import/Export
    description: Import hoặc export JSON theo từng bảng được hỗ trợ.
security:
  - BearerAuth: []
paths:
  /api_login/:
    post:
      tags: [Xác thực]
      operationId: api_login
      summary: Đăng nhập bằng email và mật khẩu
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: admin@example.com
              password: "your-password"
      responses:
        "200":
          description: Đăng nhập thành công.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Thông tin đăng nhập không hợp lệ hoặc tài khoản bị khóa/chưa liên kết nhân viên.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/ServerError"

  /api_logout/:
    post:
      tags: [Xác thực]
      operationId: api_logout
      summary: Đăng xuất và blacklist refresh token
      description: |
        Nhận refresh token trong body. Permission hiện để trống, vì vậy access
        token không bắt buộc; nếu gửi header Authorization không hợp lệ,
        JWT authentication có thể trả lỗi xác thực.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "200":
          description: Refresh token đã được blacklist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Thiếu refresh token hoặc token không hợp lệ/hết hạn.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/ServerError"

  /api_me/:
    get:
      tags: [Xác thực]
      operationId: api_me
      summary: Lấy tài khoản của người dùng hiện tại
      responses:
        "200":
          description: Thông tin tài khoản và nhân viên liên kết.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Tài khoản chưa liên kết với nhân viên.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api_create-account/:
    post:
      tags: [Xác thực]
      operationId: api_create_account
      summary: Tạo tài khoản cho nhân viên
      description: Chỉ admin được phép. Nhân viên phải tồn tại, có email và chưa có tài khoản.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountRequest"
            example:
              ma_nv: 21
              password: "change-me"
              is_admin: false
      responses:
        "201":
          description: Tài khoản được tạo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAccountResponse"
        "400":
          description: Dữ liệu không hợp lệ hoặc nhân viên đã có tài khoản/thiếu email.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api_change_password/:
    post:
      tags: [Xác thực]
      operationId: api_change_password
      summary: Đổi mật khẩu tài khoản hiện tại
      description: |
        User và admin có thể đổi mật khẩu của chính mình. Mật khẩu mới tối thiểu
        6 ký tự và phải khác mật khẩu hiện tại. Sau khi đổi, client nên đăng nhập
        lại bằng mật khẩu mới.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Mật khẩu đã được đổi.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Mật khẩu hiện tại không đúng hoặc dữ liệu không hợp lệ.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /api_refresh_token/:
    post:
      tags: [Xác thực]
      operationId: api_refresh_token
      summary: Làm mới access token
      description: |
        Endpoint SimpleJWT mặc định. Refresh token có thời hạn 7 ngày; cấu hình
        bật xoay refresh token và blacklist token cũ sau khi xoay.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRefreshRequest"
      responses:
        "200":
          description: Token mới.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenRefreshResponse"
        "401":
          description: Refresh token không hợp lệ, hết hạn hoặc đã bị blacklist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api_get_ds_nv/:
    get:
      tags: [Nhân viên]
      operationId: api_get_ds_nv
      summary: Lấy danh sách nhân viên
      description: User và admin đã đăng nhập đều có thể xem.
      responses:
        "200":
          description: Danh sách nhân viên (không phân trang).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NhanVien"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /api_get_nv/{ma_nv}/:
    parameters:
      - $ref: "#/components/parameters/MaNhanVien"
    get:
      tags: [Nhân viên]
      operationId: api_get_nv
      summary: Lấy thông tin nhân viên theo mã
      description: User chỉ được xem chính mình; admin được xem mọi nhân viên.
      responses:
        "200":
          description: Nhân viên được tìm thấy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhanVien"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api_create_nv/:
    post:
      tags: [Nhân viên]
      operationId: api_create_nv
      summary: Tạo một hoặc nhiều nhân viên
      description: Chỉ admin được phép. Body chấp nhận một object hoặc mảng object.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NhanVienInputOrList"
      responses:
        "201":
          description: Nhân viên đã được tạo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhanVienOrList"
        "400":
          description: Dữ liệu không hợp lệ.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api_update_nv/{ma_nv}/:
    parameters:
      - $ref: "#/components/parameters/MaNhanVien"
    put:
      tags: [Nhân viên]
      operationId: api_update_nv
      summary: Cập nhật thông tin nhân viên
      description: |
        User chỉ được cập nhật hồ sơ của chính mình và không được gửi `vai_tro`
        hoặc `chuyen_mon`. Admin có thể cập nhật nhân viên bất kỳ.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NhanVienInput"
      responses:
        "200":
          description: Hồ sơ đã được cập nhật.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NhanVien"
        "400":
          description: Dữ liệu không hợp lệ.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api_delete_nv/{ma_nv}/:
    parameters:
      - $ref: "#/components/parameters/MaNhanVien"
    delete:
      tags: [Nhân viên]
      operationId: api_delete_nv
      summary: Xóa nhân viên
      description: Chỉ admin được phép. Ràng buộc khóa ngoại/database có thể ngăn thao tác xóa.
      responses:
        "200":
          $ref: "#/components/responses/Deleted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api_get_ds_tb/:
    get:
      tags: [Thiết bị]
      operationId: api_get_ds_tb
      summary: Lấy danh sách thiết bị
      responses:
        "200":
          description: Danh sách thiết bị (không phân trang).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ThietBi"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /api_get_tb/{ma_tb}/:
    parameters:
      - $ref: "#/components/parameters/MaThietBi"
    get:
      tags: [Thiết bị]
      operationId: api_get_tb
      summary: Lấy thiết bị theo mã
      responses:
        "200":
          description: Thiết bị được tìm thấy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThietBi"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api_get_tb_theo_loai_tb:
    get:
      tags: [Thiết bị]
      operationId: api_get_tb_theo_loai_tb
      summary: Lọc thiết bị theo loại
      description: |
        `loai_tb` là tìm kiếm chuỗi con không phân biệt chữ hoa/thường. Bỏ qua
        hoặc để trống tham số sẽ trả toàn bộ thiết bị. Không có kết quả trả 404.
      parameters:
        - name: loai_tb
          in: query
          required: false
          schema:
            type: string
          example: Router
      responses:
        "200":
          description: Danh sách thiết bị phù hợp.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ThietBi"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Không tìm thấy thiết bị phù hợp.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/ServerError"

  /api_create_tb/:
    post:
      tags: [Thiết bị]
      operationId: api_create_tb
      summary: Tạo một hoặc nhiều thiết bị
      description: Chỉ admin được phép. `ma_tb` tự sinh; địa chỉ IP phải duy nhất.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThietBiInputOrList"
      responses:
        "201":
          description: Thiết bị đã được tạo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThietBiOrList"
        "400":
          description: Dữ liệu không hợp lệ hoặc IP bị trùng.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api_update_tb/{ma_tb}/:
    parameters:
      - $ref: "#/components/parameters/MaThietBi"
    put:
      tags: [Thiết bị]
      operationId: api_update_tb
      summary: Cập nhật thiết bị
      description: Chỉ admin được phép. Không được sửa `ma_tb`; `tinh_trang` là trường bắt buộc.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThietBiInput"
      responses:
        "200":
          description: Thiết bị đã được cập nhật.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThietBi"
        "400":
          description: Dữ liệu không hợp lệ.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api_delete_tb/{ma_tb}/:
    parameters:
      - $ref: "#/components/parameters/MaThietBi"
    delete:
      tags: [Thiết bị]
      operationId: api_delete_tb
      summary: Xóa thiết bị
      description: Chỉ admin được phép.
      responses:
        "200":
          $ref: "#/components/responses/Deleted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api_get_ds_cshs/:
    get:
      tags: [Hiệu suất]
      operationId: api_get_ds_cshs
      summary: Lấy danh sách chỉ số hiệu suất
      responses:
        "200":
          description: Danh sách chỉ số hiệu suất (không phân trang).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChiSoHieuSuat"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /api_get_cshs/{ma_cs}/:
    parameters:
      - name: ma_cs
        in: path
        required: true
        description: Mã chỉ số hiệu suất.
        schema:
          type: integer
    get:
      tags: [Hiệu suất]
      operationId: api_get_cshs
      summary: Lấy chỉ số hiệu suất theo mã
      responses:
        "200":
          description: Chỉ số hiệu suất được tìm thấy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChiSoHieuSuat"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Không tìm thấy chỉ số hiệu suất.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/ServerError"

  /api_get_ds_lh/:
    get:
      tags: [Lỗ hổng]
      operationId: api_get_ds_lh
      summary: Lấy danh sách lỗ hổng
      description: Admin xem tất cả; user chỉ xem lỗ hổng được phân công cho mình.
      responses:
        "200":
          description: Danh sách lỗ hổng (không phân trang).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LoHong"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"

  /api_get_lh/{ma_lh}/:
    parameters:
      - name: ma_lh
        in: path
        required: true
        description: Mã lỗ hổng.
        schema:
          type: integer
    get:
      tags: [Lỗ hổng]
      operationId: api_get_lh
      summary: Lấy lỗ hổng theo mã
      description: User chỉ được xem lỗ hổng được phân công cho mình.
      responses:
        "200":
          description: Lỗ hổng được tìm thấy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoHong"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api_create_lh/:
    post:
      tags: [Lỗ hổng]
      operationId: api_create_lh
      summary: Tạo một hoặc nhiều lỗ hổng
      description: |
        Chỉ admin được phép. `ma_lh` bị bỏ qua/tự sinh. Nếu không truyền,
        `thoi_gian_xay_ra_su_co` mặc định là thời điểm hiện tại và
        `trang_thai_khac_phuc` mặc định là `Chưa vá`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoHongInputOrList"
      responses:
        "201":
          description: Lỗ hổng đã được tạo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoHongOrList"
        "400":
          description: Dữ liệu không hợp lệ.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /api_update_lh/{ma_lh}/:
    parameters:
      - name: ma_lh
        in: path
        required: true
        description: Mã lỗ hổng.
        schema:
          type: integer
    put:
      tags: [Lỗ hổng]
      operationId: api_update_lh
      summary: Cập nhật lỗ hổng hoặc trạng thái khắc phục
      description: |
        Gửi dữ liệu cập nhật dạng một phần; không được sửa `ma_lh`.

        User chỉ được sửa lỗ hổng được phân công cho mình và chỉ gửi
        `trang_thai_khac_phuc`, theo thứ tự `Chưa vá` → `Đang xử lý` → `Đã vá`.
        Admin có thể cập nhật các trường khác, nhưng không được đổi người xử lý
        khi trạng thái đang xử lý/đã vá, trừ trường hợp lỗ hổng đã vá được chuyển
        về `Chưa vá` đồng thời phân công người mới.

        Khi chuyển sang `Đã vá`, thời gian xử lý được ghi nhận tự động; admin
        chuyển `Đã vá` về `Chưa vá` sẽ xóa thời gian xử lý.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoHongUpdateRequest"
            examples:
              userProgress:
                summary: Nhân viên cập nhật trạng thái theo thứ tự
                value:
                  trang_thai_khac_phuc: Đang xử lý
              adminReassign:
                summary: Admin trả về Chưa vá và đổi nhân viên xử lý
                value:
                  trang_thai_khac_phuc: Chưa vá
                  manv_xuly: 22
      responses:
        "200":
          description: Lỗ hổng đã được cập nhật.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoHong"
        "400":
          description: Trạng thái hoặc dữ liệu không hợp lệ.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorOrValidationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

